name: Common Build Steps
on:
  workflow_call:
     inputs:
       runs-on:
         required: true
         type: string
       gradle-tasks:
         required: true
         type: string
jobs:
  reusable-stt-build:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run unit tests
        run: ./gradlew test --scan
      - name: Run E2E tests (Linux)
        if: ${{ inputs.runs-on == 'ubuntu-latest' }}
        run: ./gradlew testE2e --scan
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ inputs.runs-on }}
          path: build/reports/tests/
      - name: Execute Gradle build
        run: ./gradlew ${{ inputs.gradle-tasks }} --scan
      - name: Upload dists
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ inputs.runs-on }}
          path: |
            build/dist/installer/mac*/*.dmg
            build/dist/installer/win/*.exe
            build/dist/installer/linux/*.deb
            build/dist/installer/linux/*.rpm